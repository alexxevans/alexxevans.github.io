    Research:
      - name: AI-Driven European Space Agency Satellite Retrieval (TRUTHS)
        start_date: 2024-06
        end_date: 2025-10
        summary: National Physical Laboratory (NPL)
        highlights:
          - "Developed a generative AI model for the ESA TRUTHS mission, calibrating the satellite's onboard Hyperspectral Imaging Spectrometer (HIS) to retrieve solar irradiance from thermal readings."
          - "Modelled the encoded posterior with a continuous-time diffusion model and transformer conditioning, enabling reliable uncertainty quantification. Key libraries: JAX."

      - name: Generative AI for Cold Atom Interferometry (AION)
        start_date: 2023-11
        end_date: 2024-10
        summary: Imperial College London
        highlights:
          - "Modelled quantum apparatus for AION (Atom Interferometer Observatory and Network), enabling Bayesian inference for optimal cooling parameters."
          - "Ran 2^19 atomic simulations on the Imperial HPC (~22 years of compute across 500 concurrent instances)."
          - "Applied normalising flows and diffusion to generate cooled atoms, indistinguishable from ground truth to a random forest classifier; developed novel anti-overfitting techniques for both."
          - "Key libraries: JAX, PyTorch, HyperOpt, XGBoost."

      - name: Inverse Problems in Medical Imaging with Diffusion
        start_date: 2023-11
        end_date: 2024-04
        summary: Imperial College London
        highlights:
          - "Literature review on diffusion and novel samplers for denoising medical images; awarded the highest grade in the cohort."
          - "Covered score matching through DDPMs to novel Tweedie-based samplers for inverse problems."

      - name: AI for Autonomous Marine Vessels
        start_date: 2024-01
        end_date: 2024-06
        summary: National Physical Laboratory (NPL) / UK Hydrographic Office
        highlights:
          - "Built a machine-interpretable model of the S100 series of navigational charts for autonomous vessels."
          - "Developed an LLM workflow translating chart tags into machine-readable XML, validated against an XSD schema. Key libraries: Ollama."

    Experience:
      - company: National Physical Laboratory (NPL)
        position: Scientist
        location: Teddington, London
        start_date: 2024-01
        end_date: 2025-10
        highlights:
          - "Earth Observation & Climate group: built a generative AI model for the ESA TRUTHS mission to observe climate-change mitigation strategies."
          - "Informatics group: assured HADO (autonomous security drones at Heathrow) and MAAT (Maritime Autonomy Assurance Testbed)."

      - company: National Physical Laboratory (NPL)
