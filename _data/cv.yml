    DPhil candidate in Materials at the University of Oxford working on generative
    models for the de novo design of virus-like particles. Background in machine
    learning for the physical sciences and metrology, with experience applying
    diffusion, normalising flows and Bayesian methods across physics, climate and
    autonomy projects.

